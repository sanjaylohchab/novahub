name: Build NovaHub Android APK
on: { workflow_dispatch: {}, push: { paths: [".github/workflows/build-apk.yml"] } }
jobs: {"build-apk":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"actions/setup-node@v4","with":{"node-version":"20"}},{"name":"Generate Key and Build APK","run":"set -e; mkdir -p $HOME/.bubblewrap android-build; printf '{\"jdkPath\":\"%s\",\"androidSdkPath\":\"%s\"}' \"$JAVA_HOME\" \"$ANDROID_HOME\" > $HOME/.bubblewrap/config.json; (yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1) || true; cd android-build; keytool -genkeypair -v -keystore android.keystore -alias novahub -keyalg RSA -keysize 2048 -validity 10000 -storepass novahub1234 -keypass novahub1234 -dname 'CN=NovaHub, OU=App, O=NovaHub, L=India, S=IN, C=IN'; SHA=$(keytool -list -v -keystore android.keystore -alias novahub -storepass novahub1234 | grep -iE 'SHA-?256:' | head -n 1 | sed -E 's/.*SHA-?256:[[:space:]]*//I' | tr -d '[:space:]'); printf '[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"android_app\",\"package_name\":\"com.novahub.messenger\",\"sha256_cert_fingerprints\":[\"%s\"]}}]' \"$SHA\" > assetlinks.json; printf '%s' '{\"packageId\":\"com.novahub.messenger\",\"host\":\"novahub-201e5.web.app\",\"name\":\"NovaHub\",\"launcherName\":\"NovaHub\",\"display\":\"standalone\",\"themeColor\":\"#060b13\",\"themeColorDark\":\"#060b13\",\"navigationColor\":\"#060b13\",\"navigationColorDark\":\"#060b13\",\"navigationDividerColor\":\"#060b13\",\"navigationDividerColorDark\":\"#060b13\",\"backgroundColor\":\"#060b13\",\"enableNotifications\":true,\"startUrl\":\"/\",\"iconUrl\":\"https://cdn-icons-png.flaticon.com/512/808/808439.png\",\"maskableIconUrl\":\"https://cdn-icons-png.flaticon.com/512/808/808439.png\",\"splashScreenFadeOutDuration\":300,\"signingKey\":{\"path\":\"./android.keystore\",\"alias\":\"novahub\"},\"appVersionName\":\"1.0.0\",\"appVersionCode\":1,\"shortcuts\":[],\"generatorApp\":\"bubblewrap-cli\",\"webManifestUrl\":\"https://novahub-201e5.web.app/manifest.json\",\"fallbackType\":\"customtabs\",\"features\":{},\"alphaDependencies\":{\"enabled\":false},\"enableSiteSettingsShortcut\":true,\"isChromeOSOnly\":false,\"isMetaQuest\":false,\"fullScopeUrl\":\"https://novahub-201e5.web.app/\",\"minSdkVersion\":24,\"orientation\":\"default\",\"fingerprints\":[],\"additionalTrustedOrigins\":[],\"retainedBundles\":[],\"appVersion\":\"1.0.0\"}' > twa-manifest.json; printf 'y\\ny\\ny\\n' | npx --yes @bubblewrap/cli update --skipVersionUpgrade; sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' app/build.gradle || true; chmod +x gradlew; ./gradlew assembleRelease; APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1); BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1); $BT/zipalign -v -p 4 \"$APK\" app-aligned.apk; $BT/apksigner sign --ks android.keystore --ks-key-alias novahub --ks-pass pass:novahub1234 --key-pass pass:novahub1234 --out NovaHub-Pro.apk app-aligned.apk; $BT/apksigner verify NovaHub-Pro.apk"},{"uses":"actions/upload-artifact@v4","with":{"name":"NovaHub-Android-APK","path":"android-build/NovaHub-Pro.apk\nandroid-build/assetlinks.json\nandroid-build/android.keystore"}}]}}
